name: VERA engine tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: VERA engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile public-boundary and monitor code
        run: python3 -m py_compile scripts/public_lens.py scripts/check_public_feed_health.py
      - name: Run deterministic engine contracts
        run: |
          python3 tests/test_scoring.py
          python3 tests/test_mail_ingest.py
          python3 tests/test_public_lens.py
          python3 tests/test_source_honesty.py
          python3 tests/test_neighborhood_gate.py
          python3 tests/test_public_product_boundary.py
          python3 tests/test_public_feed_health.py
