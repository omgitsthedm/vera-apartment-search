# Option A — ACTIVE (approved by David 2026-08-03, "I approve of all of it").
# The sanctioned half runs in the cloud daily; residential-IP sources stay
# on the Mac. Cloud publish joins once David adds the Netlify secrets.
#
# Scope: the SANCTIONED half only — official CSVs and GTFS, which probe
# clean from datacenter IPs. Residential-IP sources (Craigslist 403,
# Housing Connect 503, anonymous Reddit 429) stay on the Mac; Task-8
# email ingestion joins here once credentials exist (add IMAP secrets).
#
# To activate under Option A, David says the word and we:
#   1. uncomment the cron
#   2. add repo secrets: NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID (publish),
#      later VERA_IMAP_* (ingestion)
#   3. teach the Mac sweep to merge cloud-produced context instead of
#      refetching it
name: sanctioned-cloud-sweep

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC — ahead of the Mac's 06:00 sweep

jobs:
  sanctioned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Market context (StreetEasy official CSVs)
        run: python3 scripts/refresh_market_context.py
      - name: Transit universe (MTA GTFS static)
        run: python3 scripts/refresh_transit_gtfs.py
      - name: Upload produced context
        uses: actions/upload-artifact@v4
        with:
          name: sanctioned-context
          path: |
            snapshots/market_context.json
            state/transit_stations.json
            state/transit_routes.json
          retention-days: 7

  # The decisive experiment (probe 2026-08-03 showed nearly every source
  # serves datacenter IPs): the FULL pipeline in the cloud. Blocked sources
  # skip honestly via VERA_CLOUD=1. Snapshot uploads as an artifact until
  # David's Netlify secrets unlock cloud publish.
  cloud-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deps
        run: pip install --quiet pillow certifi
      - name: Full pipeline, cloud mode
        env:
          VERA_CLOUD: "1"
        run: bash scripts/run_daily.sh
      - name: Report the net
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('snapshots/latest_snapshot.json')
          if p.exists():
              d = json.loads(p.read_text())
              pool = (d.get('shortlist') or []) + (d.get('reviewed_out') or [])
              srcs = {}
              for l in pool:
                  srcs[l.get('source_name') or '?'] = srcs.get(l.get('source_name') or '?', 0) + 1
              print('CLOUD POOL:', len(pool), json.dumps(srcs))
          else:
              print('CLOUD POOL: no snapshot produced')
          PY
      - name: Upload cloud snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-snapshot
          path: snapshots/latest_snapshot.json
          retention-days: 7
          if-no-files-found: ignore
