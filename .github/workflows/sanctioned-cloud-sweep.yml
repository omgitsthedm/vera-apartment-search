# Option A — ACTIVE (approved by David 2026-08-03, "I approve of all of it").
# The sanctioned half runs in the cloud daily; residential-IP sources stay
# on the Mac. Cloud publish joins once David adds the Netlify secrets.
#
# Scope: the SANCTIONED half only — official CSVs and GTFS, which probe
# clean from datacenter IPs. Residential-IP sources (Craigslist 403,
# Housing Connect 503, anonymous Reddit 429) stay on the Mac; Task-8
# email ingestion joins here once credentials exist (add IMAP secrets).
#
# To activate under Option A, David says the word and we:
#   1. uncomment the cron
#   2. add repo secrets: NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID (publish),
#      later VERA_IMAP_* (ingestion)
#   3. teach the Mac sweep to merge cloud-produced context instead of
#      refetching it
name: sanctioned-cloud-sweep

on:
  workflow_dispatch: {}
  schedule:
    # 05:30 UTC. NOTE: the Mac's own nightly is 23:00 America/New_York
    # (03:00-04:00 UTC depending on DST), so this runs AFTER it, not ahead
    # of it as an earlier comment claimed.
    #
    # Punctuality is not guaranteed and has not yet been observed: on
    # 2026-08-04 nothing had fired 32 minutes past the slot, with the
    # workflow state=active and the cron valid on the default branch.
    # GitHub's scheduled queue is best-effort and most congested at :00
    # and :30. If it proves chronically late, move to an odd minute
    # (e.g. "37 5 * * *") or trigger from an external scheduler — both are
    # schedule changes and need David's authorization.
    - cron: "30 5 * * *"

jobs:
  sanctioned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Market context (StreetEasy official CSVs)
        run: python3 scripts/refresh_market_context.py
      - name: Transit universe (MTA GTFS static)
        run: python3 scripts/refresh_transit_gtfs.py
      - name: Upload produced context
        uses: actions/upload-artifact@v4
        with:
          name: sanctioned-context
          path: |
            snapshots/market_context.json
            state/transit_stations.json
            state/transit_routes.json
          retention-days: 7

  # The decisive experiment (probe 2026-08-03 showed nearly every source
  # serves datacenter IPs): the FULL pipeline in the cloud. Blocked sources
  # skip honestly via VERA_CLOUD=1.
  #
  # PUBLISHING (2026-08-04): this job now publishes its own feed to the
  # orphan `feed` branch, which raw.githubusercontent.com serves with
  # `access-control-allow-origin: *`. That needs no Netlify token and no
  # secret of any kind — only the automatic GITHUB_TOKEN. Before this, the
  # cloud found real listings every day (231 on 2026-08-04) and buried all
  # of them in a 7-day artifact nothing could read.
  cloud-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # only to force-push the orphan `feed` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deps
        run: pip install --quiet pillow certifi
      - name: HF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ai-image-detector-v1
      - name: AI-photo deps (CPU wheels)
        run: pip install --quiet transformers "torch>=2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Full pipeline, cloud mode
        env:
          VERA_CLOUD: "1"
        run: bash scripts/run_daily.sh
      - name: AI-photo pass (probabilistic, HF)
        if: always()
        run: python3 scripts/detect_ai_photos.py || echo "[WARN] ai-photo pass failed (non-fatal)"
      - name: Report the net
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('snapshots/latest_snapshot.json')
          if p.exists():
              d = json.loads(p.read_text())
              pool = (d.get('shortlist') or []) + (d.get('reviewed_out') or [])
              srcs = {}
              for l in pool:
                  srcs[l.get('source_name') or '?'] = srcs.get(l.get('source_name') or '?', 0) + 1
              print('CLOUD POOL:', len(pool), json.dumps(srcs))
          else:
              print('CLOUD POOL: no snapshot produced')
          PY
      - name: Upload cloud snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-snapshot
          path: snapshots/latest_snapshot.json
          retention-days: 7
          if-no-files-found: ignore

      # ── Publish. No secrets in this chain. ──────────────────────────
      - name: Carry the drop archive forward
        if: always()
        run: |
          mkdir -p public_feed
          # maintain_archive() keeps 60 rolling days, but a fresh runner has
          # no history — without this seed every publish would reset the
          # receipts to a single day and the archive page would go blank.
          curl -sfL --max-time 30 -o public_feed/archive.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/feed/archive.json" \
            || echo "[]" > public_feed/archive.json
          python3 -c "import json,sys; d=json.load(open('public_feed/archive.json')); print(f'seeded {len(d)} archived day(s)')" \
            || echo "[]" > public_feed/archive.json

      - name: Build the public feed (same lens the Netlify feed uses)
        if: always()
        run: python3 scripts/publish_cloud_feed.py --out public_feed

      - name: Push it to the `feed` branch
        if: always()
        run: |
          test -s public_feed/public.json || { echo "no feed built — nothing to publish"; exit 1; }
          git config user.name  "vera-cloud"
          git config user.email "vera-cloud@users.noreply.github.com"
          # Orphan branch, force-pushed: one commit that gets replaced each
          # run, so a 1.5MB daily JSON never accumulates in real history.
          MSG="$(python3 -c "import json;m=json.load(open('public_feed/meta.json'));print(f\"feed: {m['pool']} listings, {m['shortlist']} shortlisted, {m['generated_at']}\")")"
          git checkout --orphan feed-publish
          git reset
          # The branch holds exactly these three files at its root, so the
          # served URLs stay short: /feed/public.json, /feed/archive.json.
          cp public_feed/public.json public_feed/archive.json public_feed/meta.json .
          git add -f public.json archive.json meta.json
          git commit -q -m "$MSG"
          git push -f origin feed-publish:feed
          echo "published -> https://raw.githubusercontent.com/${{ github.repository }}/feed/public.json"
