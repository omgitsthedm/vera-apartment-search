# Option A — ACTIVE (approved by David 2026-08-03, "I approve of all of it").
#
# PUBLISHING NEEDS NO SECRET. This used to say "cloud publish joins once
# David adds the Netlify secrets" and told the reader to create
# NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID. That is superseded: the publish
# step below uses only the automatic GITHUB_TOKEN. Do NOT create a Netlify
# personal access token for VERA — the Little Fight NYC handoff records
# this as a settled determination, and a PAT created during setup was
# deleted once the code audit proved it unnecessary.
#
# Scope: official CSVs and GTFS probe clean from datacenter IPs, and the
# 2026-08-03 probe showed nearly every source does. Genuinely blocked
# sources (renthop, leasebreak, housing_connect, streeteasy) skip honestly
# via VERA_CLOUD=1. Email ingestion is not here and is blocked on a
# human-owned Google account appeal, not on secrets.
name: sanctioned-cloud-sweep

on:
  workflow_dispatch: {}
  schedule:
    # 05:30 UTC. NOTE: the Mac's own nightly is 23:00 America/New_York
    # (03:00-04:00 UTC depending on DST), so this runs AFTER it, not ahead
    # of it as an earlier comment claimed.
    #
    # Punctuality is not guaranteed and has not yet been observed: on
    # 2026-08-04 nothing had fired 32 minutes past the slot, with the
    # workflow state=active and the cron valid on the default branch.
    # GitHub's scheduled queue is best-effort and most congested at :00
    # and :30. If it proves chronically late, move to an odd minute
    # (e.g. "37 5 * * *") or trigger from an external scheduler — both are
    # schedule changes and need David's authorization.
    - cron: "30 5 * * *"

jobs:
  sanctioned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Market context (StreetEasy official CSVs)
        run: python3 scripts/refresh_market_context.py
      - name: Transit universe (MTA GTFS static)
        run: python3 scripts/refresh_transit_gtfs.py
      - name: Upload produced context
        uses: actions/upload-artifact@v4
        with:
          name: sanctioned-context
          path: |
            snapshots/market_context.json
            state/transit_stations.json
            state/transit_routes.json
          retention-days: 7

  # The decisive experiment (probe 2026-08-03 showed nearly every source
  # serves datacenter IPs): the FULL pipeline in the cloud. Blocked sources
  # skip honestly via VERA_CLOUD=1.
  #
  # PUBLISHING (2026-08-04): this job now publishes its own feed to the
  # orphan `feed` branch, which raw.githubusercontent.com serves with
  # `access-control-allow-origin: *`. That needs no Netlify token and no
  # secret of any kind — only the automatic GITHUB_TOKEN. Before this, the
  # cloud found real listings every day (231 on 2026-08-04) and buried all
  # of them in a 7-day artifact nothing could read.
  cloud-discovery:
    runs-on: ubuntu-latest
    # 45 was sized for discovery alone. This job now also runs 33 extra
    # neighbourhood queries, a craigslist budget spent on the boroughs that
    # matter, and three enrichment steps — one of which downloads a photo per
    # listing to fingerprint it. A timeout here would abandon the run after
    # paying for all of it, so the ceiling is generous rather than tight.
    timeout-minutes: 75
    permissions:
      contents: write        # only to force-push the orphan `feed` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deps
        run: pip install --quiet pillow certifi
      # The first cloud publish (2026-08-04) shipped without either of these
      # and the Market page and every commute time came back empty: the
      # sanctioned job produces them, but only into an artifact this job
      # cannot see. Both are official CSVs / GTFS and probe clean from
      # datacenter IPs, so this job just produces its own. Non-fatal — a
      # source outage should degrade the feed honestly, not block it.
      - name: Market context (StreetEasy official CSVs)
        run: python3 scripts/refresh_market_context.py || echo "[WARN] market context unavailable — feed publishes without it"
      - name: Transit universe (MTA GTFS static)
        run: python3 scripts/refresh_transit_gtfs.py || echo "[WARN] transit universe unavailable — feed publishes without commute times"
      # THE ENGINE'S MEMORY. Without this the cloud is amnesiac: state/ is
      # gitignored, so every run started from nothing and silently lost
      #   - photo_hashes / photo_provenance / photo_clone_flags: the same
      #     photo reused across listings is one of the strongest scam
      #     signals there is, and it can only be seen across runs
      #   - price_history: days-on-market and price paths
      #   - change_history + daily_changes: what is actually new today
      #   - source_trends: the baseline that catches a source going quietly
      #     to zero
      #   - landlord_portfolios / address_history
      #
      # Deliberately the Actions cache and not a branch: this is listing and
      # landlord data that has never been through the public lens, and the
      # engine repo is public. The cache is readable only by workflow runs.
      # Restored by prefix and saved under a fresh key each run, because
      # cache entries are immutable. Daily cron keeps it well inside the
      # 7-day eviction window.
      #
      # CHANGING THIS PATH LIST WIPES THE MEMORY ONCE. GitHub derives an
      # internal cache version from the set of paths, so a cache saved under
      # the old list cannot be matched by a restore using the new one — not
      # even by restore-keys. Observed 2026-08-04: runs chained fine
      # (…814 restored from …763, …763 from …577) until three paths were
      # added, and the next run reported "Cache not found for input keys"
      # against a cache that plainly existed on the same ref. The run after
      # that restored normally. Expect one blank night per path change and
      # do not go hunting for a bug.
      - name: Restore the engine's memory
        uses: actions/cache/restore@v4
        with:
          path: |
            state/price_history.json
            state/change_history.json
            state/address_history.json
            state/source_trends.json
            state/source_anomalies.json
            state/run_trends.json
            state/photo_hashes.json
            state/photo_provenance.json
            state/photo_clone_flags.json
            state/landlord_portfolios.json
            state/ai_photo_flags.json
            state/daily_changes
            # NOT state/ — config/paths.py maps LEGACY_STATE_DIR to
            # cache/state, and normalize_listings, build_snapshot and
            # score_listings all import it as STATE_ROOT. These two are
            # written there. Cached under state/ they restored as absent
            # while the file sat in cache/state the whole time.
            cache/state/listing_history.json
            cache/state/seen_cluster_ids.json
          key: vera-state-${{ github.run_id }}
          restore-keys: vera-state-
      - name: What it remembered
        run: |
          python3 - <<'PY'
          import json, pathlib
          for name in ("source_trends", "price_history", "photo_hashes", "change_history",
                       "ai_photo_flags", "listing_history", "landlord_portfolios"):
              p = pathlib.Path("state") / f"{name}.json"
              if not p.exists():
                  p = pathlib.Path("cache/state") / f"{name}.json"
              if not p.exists():
                  print(f"  {name}: absent — first run, or the cache expired")
                  continue
              try:
                  d = json.loads(p.read_text())
                  print(f"  {name}: {len(d)} entries ({p.stat().st_size:,} bytes)")
              except Exception as e:
                  print(f"  {name}: unreadable ({e})")
          PY
      - name: HF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ai-image-detector-v1
      - name: AI-photo deps (CPU wheels)
        run: pip install --quiet transformers "torch>=2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Full pipeline, cloud mode
        env:
          VERA_CLOUD: "1"
        run: bash scripts/run_daily.sh
      - name: AI-photo pass (probabilistic, HF)
        if: always()
        run: python3 scripts/detect_ai_photos.py || echo "[WARN] ai-photo pass failed (non-fatal)"

      # The layer that makes VERA more than an aggregator, and which had
      # never once run in the cloud: run_daily.sh stops at build_snapshot,
      # and these live in the Mac's run_nightly_autonomous.sh. So the cloud
      # feed — now the primary path — carried no cloned-photo detection, no
      # days-on-market, and no answer to the question the whole thesis rests
      # on: what does this owner do to their OTHER tenants?
      #
      # Each writes state that build_snapshot folds in on the NEXT compose,
      # which is why they were pointless here until the run-to-run cache
      # landed earlier today. Non-fatal, in the Mac's own order.
      #
      # scan_photo_provenance is deliberately NOT here: it was measured at
      # 0/60 photos carrying any metadata, because portals re-encode and
      # strip EXIF. It would cost a download per photo to learn nothing.
      - name: Price memory (true days-on-market)
        if: always()
        run: python3 scripts/record_price_history.py || echo "[WARN] price history failed (non-fatal)"
      - name: Cloned-photo fingerprints (the scam wall's memory)
        if: always()
        run: python3 scripts/refresh_photo_hashes.py || echo "[WARN] photo hashing failed (non-fatal)"
      - name: Landlord portfolios (JustFix Who Owns What)
        if: always()
        run: python3 scripts/refresh_landlord_portfolios.py || echo "[WARN] portfolio refresh failed (non-fatal)"
      - name: What the enrichment layer knows now
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          for name, label in (("price_history", "listings with a price path"),
                              ("photo_hashes", "photos fingerprinted"),
                              ("photo_clone_flags", "cloned-photo flags"),
                              ("landlord_portfolios", "landlord portfolios")):
              p = pathlib.Path("state") / f"{name}.json"
              if not p.exists():
                  p = pathlib.Path("cache/state") / f"{name}.json"
              try:
                  print(f"  {label}: {len(json.loads(p.read_text()))}")
              except Exception:
                  print(f"  {label}: none yet")
          PY
      - name: Report the net
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('snapshots/latest_snapshot.json')
          if p.exists():
              d = json.loads(p.read_text())
              pool = (d.get('shortlist') or []) + (d.get('reviewed_out') or [])
              srcs = {}
              for l in pool:
                  srcs[l.get('source_name') or '?'] = srcs.get(l.get('source_name') or '?', 0) + 1
              print('CLOUD POOL:', len(pool), json.dumps(srcs))
          else:
              print('CLOUD POOL: no snapshot produced')
          PY
      - name: Upload cloud snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-snapshot
          path: snapshots/latest_snapshot.json
          retention-days: 7
          if-no-files-found: ignore

      # Saved even when the pipeline failed: a partial run still advanced
      # the photo and price memory, and throwing that away would mean the
      # next run relearns from nothing.
      - name: Save the engine's memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/price_history.json
            state/change_history.json
            state/address_history.json
            state/source_trends.json
            state/source_anomalies.json
            state/run_trends.json
            state/photo_hashes.json
            state/photo_provenance.json
            state/photo_clone_flags.json
            state/landlord_portfolios.json
            state/ai_photo_flags.json
            state/daily_changes
            # NOT state/ — config/paths.py maps LEGACY_STATE_DIR to
            # cache/state, and normalize_listings, build_snapshot and
            # score_listings all import it as STATE_ROOT. These two are
            # written there. Cached under state/ they restored as absent
            # while the file sat in cache/state the whole time.
            cache/state/listing_history.json
            cache/state/seen_cluster_ids.json
          key: vera-state-${{ github.run_id }}

      # ── Publish. No secrets in this chain. ──────────────────────────
      - name: Carry the drop archive forward
        if: always()
        run: |
          mkdir -p public_feed
          # maintain_archive() keeps 60 rolling days, but a fresh runner has
          # no history — without this seed every publish would reset the
          # receipts to a single day and the archive page would go blank.
          curl -sfL --max-time 30 -o public_feed/archive.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/feed/archive.json" \
            || echo "[]" > public_feed/archive.json
          python3 -c "import json,sys; d=json.load(open('public_feed/archive.json')); print(f'seeded {len(d)} archived day(s)')" \
            || echo "[]" > public_feed/archive.json

      - name: Build the public feed (same lens the Netlify feed uses)
        if: always()
        run: python3 scripts/publish_cloud_feed.py --out public_feed

      - name: Push it to the `feed` branch
        if: always()
        run: |
          test -s public_feed/public.json || { echo "no feed built — nothing to publish"; exit 1; }
          git config user.name  "vera-cloud"
          git config user.email "vera-cloud@users.noreply.github.com"
          # Orphan branch, force-pushed: one commit that gets replaced each
          # run, so a 1.5MB daily JSON never accumulates in real history.
          MSG="$(python3 -c "import json;m=json.load(open('public_feed/meta.json'));print(f\"feed: {m['pool']} listings, {m['shortlist']} shortlisted, {m['generated_at']}\")")"
          git checkout --orphan feed-publish
          git reset
          # The branch holds exactly these three files at its root, so the
          # served URLs stay short: /feed/public.json, /feed/archive.json.
          cp public_feed/public.json public_feed/archive.json public_feed/meta.json .
          git add -f public.json archive.json meta.json
          git commit -q -m "$MSG"
          git push -f origin feed-publish:feed
          echo "published -> https://raw.githubusercontent.com/${{ github.repository }}/feed/public.json"
